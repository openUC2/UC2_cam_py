[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "uc2_cam_py"
version = "0.2.0"
description = "Python bindings for the MVS / HikRobot camera tool to be used in the UC2 ecosystem."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Christian Karras", email = "christian-karras@web.de" }]
dependencies = ["numpy>=1.21"]

[project.scripts]
# Optional convenience entry point: `uc2_cam_py` runs the interactive session.
uc2_cam_py = "uc2_cam_py.__main__:main"

[tool.scikit-build]
# Use the versions declared in build-system.requires for CMake feature checks.
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# The pure-Python package lives under python/; the compiled _hik module
# is installed next to it by CMake (install(TARGETS _hik DESTINATION uc2_cam_py)).
wheel.packages = ["python/uc2_cam_py"]

[tool.scikit-build.cmake.define]
# The wheel only needs the extension module, not the example programs
# (HikStandAlone would otherwise be installed into the wheel's bin/).
HIK_BUILD_EXAMPLES = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires a connected HikRobot/MVS camera",
    "display: opens a preview window (skipped without DISPLAY/WAYLAND_DISPLAY)",
]

[tool.uv]
# Rebuild the extension when the C++/CMake sources change during development.
# (uv respects this for editable installs.)
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "core/**/*" },
    { file = "bindings/**/*" },
]

[dependency-groups]
dev = [
    "pytest>=8", 
    "pybind11>=2.12",       # needed for direct CMake configure in the IDE
    "scikit-build-core>=0.10",
    "cmake>=3.15",          # optional: pins the CMake used by the IDE too
]
