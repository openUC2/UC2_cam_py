[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "uc2_cam_py"
# The version lives in the file VERSION (read below and by CMake).
dynamic = ["version"]
description = "Python bindings for the MVS / HikRobot camera tool to be used in the UC2 ecosystem."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Christian Karras", email = "christian-karras@web.de" }]
dependencies = ["numpy>=1.21"]

[project.scripts]
# Optional convenience entry point: `uc2_cam_py` runs the interactive session.
uc2_cam_py = "uc2_cam_py.__main__:main"

[tool.scikit-build]
# Use the versions declared in build-system.requires for CMake feature checks.
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# The pure-Python package lives under python/; the compiled _hik module
# is installed next to it by CMake (install(TARGETS _hik DESTINATION uc2_cam_py)).
wheel.packages = ["python/uc2_cam_py"]

[tool.scikit-build.cmake.define]
# The wheel only needs the extension module, not the example programs
# (HikStandAlone would otherwise be installed into the wheel's bin/).
HIK_BUILD_EXAMPLES = "OFF"

[tool.scikit-build.metadata.version]
# The package version is the content of the file VERSION (MAJOR.MINOR.PATCH),
# the same number CMake compiles into the C++ code (core/cmake/UC2Version.cmake).
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>\d+\.\d+\.\d+)'

[tool.ruff]
# target-version follows requires-python (3.12).
line-length = 120

[tool.ruff.lint]
extend-select = ["UP", "PYI", "RUF"]
ignore = [
    "PYI021",  # _hik.pyi carries the docstrings that Pylance shows on hover for the compiled module
    "RUF022",  # __all__ in __init__.py is grouped by topic, not sorted
]
# pep8-naming is not selected here but may be in the editor; keep its noqa comments.
external = ["N"]

[tool.ruff.lint.isort]
# The package lives under python/, so Ruff cannot detect it; conftest is the tests' helper module.
known-first-party = ["uc2_cam_py"]
known-local-folder = ["conftest"]
combine-as-imports = true

[tool.ruff.lint.flake8-comprehensions]
# dict(name=value) reads as keyword arguments in the parametrised test tables.
allow-dict-calls-with-keyword-arguments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires a connected HikRobot/MVS camera",
    "display: opens a preview window (skipped without DISPLAY/WAYLAND_DISPLAY)",
]

[tool.uv]
# Rebuild the extension when the C++/CMake sources change during development.
# (uv respects this for editable installs.)
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "core/**/*" },
    { file = "bindings/**/*" },
    { file = "External/hik/MVS/VERSION" },   # rewritten by `uv run fetch_mvs`
    { file = "VERSION" },                    # the package version
]

[tool.uv.sources]
uc2-cam-py-devtasks = { path = "tools/devtasks", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pybind11>=2.12",       # needed for direct CMake configure in the IDE
    "scikit-build-core>=0.10",
    "cmake>=3.15",          # optional: pins the CMake used by the IDE too
    "uc2-cam-py-devtasks",  # uv run main | py_tests | c_tests | all_tests (tools/devtasks)
]
